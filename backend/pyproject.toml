[project]
name = "trident-backend"
version = "0.1.0"
description = "Trident v3 backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
