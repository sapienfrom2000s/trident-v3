apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelineruns.trident.dev
spec:
  group: trident.dev
  scope: Namespaced
  names:
    plural: pipelineruns
    kind: PipelineRun
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Repo
          type: string
          jsonPath: .spec.repo
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - repo
                - commit
                - steps
              properties:
                repo:
                  type: string
                  description: Git repository URL to build.
                commit:
                  type: string
                  description: Commit SHA (or ref) to check out.
                steps:
                  type: array
                  description: >-
                    Build steps. Opaque for now — real per-step schema
                    (ordering, images, commands) lands in Phase 6.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                  description: Written only by the controller.
                podName:
                  type: string
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
