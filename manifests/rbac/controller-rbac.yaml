apiVersion: v1
kind: ServiceAccount
metadata:
  name: trident-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trident-controller
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["trident.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["trident.dev"]
    resources: ["pipelineruns/status"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trident-controller
  namespace: default
subjects:
  - kind: ServiceAccount
    name: trident-controller
    namespace: default
roleRef:
  kind: Role
  name: trident-controller
  apiGroup: rbac.authorization.k8s.io
