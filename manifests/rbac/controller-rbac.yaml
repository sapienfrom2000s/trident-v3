apiVersion: v1
kind: ServiceAccount
metadata:
  name: trident-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trident-controller
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get"]
  - apiGroups: ["trident.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["trident.dev"]
    resources: ["pipelineruns/status"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trident-controller
  namespace: default
subjects:
  - kind: ServiceAccount
    name: trident-controller
    namespace: default
roleRef:
  kind: Role
  name: trident-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trident-controller
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trident-controller
subjects:
  - kind: ServiceAccount
    name: trident-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: trident-controller
  apiGroup: rbac.authorization.k8s.io
